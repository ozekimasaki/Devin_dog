<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="340" height="340">
  <title>Cute animated dog</title>
  <defs>
    <radialGradient id="fur" cx="50%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#FAD7A8"/>
      <stop offset="100%" stop-color="#EFB071"/>
    </radialGradient>
    <linearGradient id="darkFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A67443"/>
      <stop offset="100%" stop-color="#8A5630"/>
    </linearGradient>
    <linearGradient id="tongueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9DB0"/>
      <stop offset="100%" stop-color="#FF7A93"/>
    </linearGradient>
    <linearGradient id="collarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E85D34"/>
      <stop offset="100%" stop-color="#C94A26"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="100%" stop-color="#F0B43C"/>
    </linearGradient>
  </defs>
  <style>
    .dog {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: hop 7s ease-in-out infinite;
    }
    @keyframes hop {
      0%, 86%, 100% { transform: translateY(0) scaleY(1); }
      89%           { transform: translateY(-7px) scaleY(1.01); }
      92%           { transform: translateY(0) scaleY(0.98); }
      95%           { transform: translateY(-3px) scaleY(1); }
    }
    .tail {
      transform-box: fill-box;
      transform-origin: 12% 88%;
      animation: wag 0.6s ease-in-out infinite alternate;
    }
    @keyframes wag {
      from { transform: rotate(-16deg); }
      to   { transform: rotate(20deg); }
    }
    .eyes {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: blink 4.4s infinite;
    }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      93%           { transform: scaleY(0.08); }
    }
    .ear-left {
      transform-box: fill-box;
      transform-origin: 65% 12%;
      animation: earTwitchL 4.4s infinite;
    }
    @keyframes earTwitchL {
      0%, 84%, 100% { transform: rotate(0deg); }
      87%           { transform: rotate(-10deg); }
      91%           { transform: rotate(7deg); }
      95%           { transform: rotate(-3deg); }
    }
    .ear-right {
      transform-box: fill-box;
      transform-origin: 35% 12%;
      animation: earTwitchR 6.1s infinite;
    }
    @keyframes earTwitchR {
      0%, 76%, 100% { transform: rotate(0deg); }
      79%           { transform: rotate(10deg); }
      83%           { transform: rotate(-6deg); }
      87%           { transform: rotate(3deg); }
    }
    .tongue {
      animation: pant 0.55s ease-in-out infinite alternate;
    }
    @keyframes pant {
      from { transform: translateY(0); }
      to   { transform: translateY(3.5px); }
    }
    .head {
      transform-box: fill-box;
      transform-origin: 50% 96%;
      animation: headBob 4.4s ease-in-out infinite;
    }
    @keyframes headBob {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      50%      { transform: rotate(2.2deg) translateY(1.5px); }
    }
    .body {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: breathe 3.2s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scaleY(1); }
      50%      { transform: scaleY(1.022); }
    }
    .shadow {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: shadowPulse 7s ease-in-out infinite;
    }
    @keyframes shadowPulse {
      0%, 86%, 100% { transform: scaleX(1); opacity: 0.16; }
      89%           { transform: scaleX(0.94); opacity: 0.12; }
      92%           { transform: scaleX(1.03); opacity: 0.18; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Ground shadow -->
  <ellipse class="shadow" cx="170" cy="308" rx="105" ry="15" fill="#3A2E2E"/>

  <g class="dog">
    <!-- Tail -->
    <g class="tail">
      <path d="M243 252 C282 242 300 210 288 178 C283 165 268 167 270 179 C275 205 262 226 238 236 Z" fill="url(#darkFur)"/>
      <ellipse cx="281" cy="176" rx="11" ry="9" fill="#FDE7C9" transform="rotate(-30 281 176)"/>
    </g>

    <!-- Body -->
    <g class="body">
      <ellipse cx="100" cy="258" rx="38" ry="34" fill="url(#fur)"/>
      <ellipse cx="240" cy="258" rx="38" ry="34" fill="url(#fur)"/>
      <ellipse cx="170" cy="230" rx="78" ry="64" fill="url(#fur)"/>
      <ellipse cx="170" cy="250" rx="44" ry="36" fill="#FDE7C9"/>
      <!-- Hind paws -->
      <ellipse cx="74" cy="292" rx="17" ry="9" fill="#FDE7C9" transform="rotate(-8 74 292)"/>
      <ellipse cx="266" cy="292" rx="17" ry="9" fill="#FDE7C9" transform="rotate(8 266 292)"/>
      <path d="M68 288 L68 295 M78 288 L78 295" stroke="#E3B47E" stroke-width="2" stroke-linecap="round"/>
      <path d="M262 288 L262 295 M272 288 L272 295" stroke="#E3B47E" stroke-width="2" stroke-linecap="round"/>
      <!-- Front legs -->
      <rect x="133" y="246" width="27" height="52" rx="13.5" fill="url(#fur)"/>
      <rect x="180" y="246" width="27" height="52" rx="13.5" fill="url(#fur)"/>
      <!-- Front paws -->
      <ellipse cx="146" cy="298" rx="19" ry="10" fill="#FDE7C9"/>
      <ellipse cx="194" cy="298" rx="19" ry="10" fill="#FDE7C9"/>
      <path d="M140 294 L140 302 M151 294 L151 302" stroke="#E3B47E" stroke-width="2" stroke-linecap="round"/>
      <path d="M188 294 L188 302 M199 294 L199 302" stroke="#E3B47E" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Collar + tag -->
    <path d="M104 172 Q170 196 236 172 L236 188 Q170 212 104 188 Z" fill="url(#collarGrad)"/>
    <rect x="166" y="196" width="8" height="6" rx="2" fill="#B03E20"/>
    <circle cx="170" cy="207" r="9" fill="url(#tagGrad)" stroke="#D9A93E" stroke-width="1.5"/>
    <circle cx="167" cy="204" r="2" fill="#FFF6D8" opacity="0.8"/>

    <!-- Head -->
    <g class="head">
      <!-- Ears -->
      <g class="ear-left">
        <path d="M122 60 C94 46 60 60 54 96 C49 128 62 156 86 160 C104 163 112 146 110 124 C108 100 112 78 122 60 Z" fill="url(#darkFur)"/>
        <path d="M100 84 C84 82 70 96 70 116 C70 134 80 148 90 146 C98 144 98 124 96 108 Z" fill="#C98F5F" opacity="0.75"/>
      </g>
      <g class="ear-right">
        <path d="M218 60 C246 46 280 60 286 96 C291 128 278 156 254 160 C236 163 228 146 230 124 C232 100 228 78 218 60 Z" fill="url(#darkFur)"/>
        <path d="M240 84 C256 82 270 96 270 116 C270 134 260 148 250 146 C242 144 242 124 244 108 Z" fill="#C98F5F" opacity="0.75"/>
      </g>
      <!-- Head shape -->
      <path d="M170 48 C208 48 238 70 240 106 C241 126 232 148 210 160 C196 168 184 172 170 172 C156 172 144 168 130 160 C108 148 99 126 100 106 C102 70 132 48 170 48 Z" fill="url(#fur)"/>
      <!-- Forehead tuft -->
      <path d="M156 52 Q162 38 170 47 Q178 36 184 52 Q170 45 156 52 Z" fill="#EFB071"/>
      <!-- Eye patch -->
      <ellipse cx="208" cy="96" rx="26" ry="24" fill="#E0A066"/>
      <!-- Eyebrows -->
      <path d="M124 78 Q135 72 146 77" stroke="#D99A5B" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.65"/>
      <path d="M194 77 Q205 72 216 78" stroke="#B97C42" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.65"/>
      <!-- Eyes -->
      <g class="eyes">
        <circle cx="140" cy="104" r="13.5" fill="#3A2E2E"/>
        <circle cx="200" cy="104" r="13.5" fill="#3A2E2E"/>
        <circle cx="144.5" cy="99" r="4.8" fill="#FFFFFF"/>
        <circle cx="204.5" cy="99" r="4.8" fill="#FFFFFF"/>
        <circle cx="136.5" cy="109" r="2.2" fill="#FFFFFF" opacity="0.7"/>
        <circle cx="196.5" cy="109" r="2.2" fill="#FFFFFF" opacity="0.7"/>
      </g>
      <!-- Blush -->
      <ellipse cx="104" cy="138" rx="11" ry="6.5" fill="#F19A7B" opacity="0.7"/>
      <ellipse cx="236" cy="138" rx="11" ry="6.5" fill="#F19A7B" opacity="0.7"/>
      <!-- Muzzle -->
      <ellipse cx="170" cy="140" rx="32" ry="24" fill="#FDE7C9"/>
      <!-- Whisker dots -->
      <circle cx="142" cy="140" r="1.6" fill="#E3B47E"/>
      <circle cx="149" cy="145" r="1.6" fill="#E3B47E"/>
      <circle cx="198" cy="140" r="1.6" fill="#E3B47E"/>
      <circle cx="191" cy="145" r="1.6" fill="#E3B47E"/>
      <!-- Tongue -->
      <g class="tongue">
        <path d="M157 146 Q170 141 183 146 L180 178 Q170 188 160 178 Z" fill="url(#tongueGrad)"/>
        <path d="M170 151 L170 178" stroke="#E5697F" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <!-- Nose -->
      <path d="M155 120 Q170 112 185 120 Q185 134 170 136 Q155 134 155 120 Z" fill="#4A3730"/>
      <ellipse cx="163" cy="122" rx="4" ry="2.5" fill="#FFFFFF" opacity="0.45"/>
      <!-- Mouth -->
      <path d="M167 136 Q161 148 150 145" stroke="#4A3730" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M173 136 Q179 148 190 145" stroke="#4A3730" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
